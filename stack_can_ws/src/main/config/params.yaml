geofence_monitor:
  ros__parameters:
    fence_csv: "/root/stack_can_ws/data/fence.csv"
    gps_topic: "/fix_center"          # 你用于控制的GNSS中心点
    warn_margin_m: 2.0                # 距离边界<5m进入WARN
    check_period_s: 0.2
    abort_on_outside: true

traj_waypoint_follower:
  ros__parameters:
    # 路径与传感器
    path_csv: "/root/stack_can_ws/data/points.csv"
    gps_topic: "/fix_center"
    imu_topic: "/imu/data"

    use_rtk_heading: true
    rtk_heading_topic: "/vehicle_heading_deg"
    use_imu_fallback: false
    yaw_offset_deg: 0.0

    # 几何控制
    lookahead_dist: 1.5
    advance_when_close: 2.0
    t_advance_min: 0.8

    # 任务点
    use_csv_heading: true
    align_heading_only_at_task_points: true
    heading_align_dist: 1.0
    wp_reached_dist: 1.0
    wp_heading_tol_deg: 10.0
    stop_turn_tol_deg: 10.0
    wait_for_task_done: true
    task_done_topic: "/task_done"

    # 坐标系
    map_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    traj_path_len: 2000

    # CAN
    enable_can: true
    can_interface: "can0"
    can_extended: true
    can_id_status: 0x18FED188
    link_remote_to_abort: true

    # DR（可按需求开启/关闭）
    dead_reckon: false
    dr_alpha: 0.3
    dr_use_gps_speed: true
    actual_speed_topic: "/ground_speed_mps"

    # VCU 离散控制
    vcu_speed_fast_kmh: 4.0
    vcu_speed_slow_kmh: 4.0
    vcu_speed_stop_kmh: 0.0

    # 角度档 & 阈值（与你 stack 硬件保持一致）
    vcu_angle_move_limit_deg: 20.0
    vcu_turn_small_cmd_deg: 10.0
    vcu_turn_large_cmd_deg: 20.0
    vcu_turn_small_thresh_deg: 5.0
    vcu_turn_large_thresh_deg: 10.0

    # SPIN 进入/退出条件
    vcu_angle_spin_enter_deg: 20.0
    vcu_angle_spin_exit_deg: 18.0
    vcu_angle_spin_cmd_deg: 20.0
    spin_pre_stop_time_s: 0.7   # 从低速/高速进入原地旋转前，保持 0速0角 的时间（秒）

    # 拐角识别
    strict_corner_mode: true
    corner_start_dist: 1.0
    corner_sharp_deg_strict: 45.0
    strict_hold_deg: 2.0

    # 误差阈值
    emergency_spin_hdg_deg: 35.0   # 比原来 55° 更容易触发紧急 SPIN
    hdg_deadband_deg: 1.0
    cte_deadband_m: 0.1
    sign_hysteresis_deg: 1.0

stack_can_executor:
  ros__parameters:
    enable_can: true
    can_interface: "can0"
    can_extended: true
    can_id_status: 0x18FED188

    vcu_speed_raw_offset_kmh: -50.0
    vcu_speed_raw_res_kmh_per_lsb: 0.5

can_feedback_node:
  ros__parameters:
    enable_can: true
    can_interface: "can0"
    can_extended: true

    # 电机实际转速反馈：byte1低字节，byte2高字节，1 rpm/bit
    left_rpm_can_id: 0x0CF11E05
    right_rpm_can_id: 0x0CF11E06

    # VCU油门反馈：byte1=0~255对应0~5V，byte2=1表示CAN控制模式
    left_throttle_can_id: 0x0CF1051E
    right_throttle_can_id: 0x0CF1061E

    # 需要按实车标定：如果报文是电机轴转速，填减速比；如果已经是轮速，保持1.0
    wheel_radius_m: 0.315
    motor_to_wheel_ratio: 1.0
    wheel_track_m: 1.0
    left_rpm_sign: 1.0
    right_rpm_sign: 1.0

    feedback_timeout_s: 0.5
    publish_rate_hz: 50.0
    feedback_topic: "/stack_can/feedback"
    ground_speed_topic: "/ground_speed_mps"
    yaw_rate_topic: "/wheel_yaw_rate_rad_s"

motor_protection_node:
  ros__parameters:
    feedback_topic: "/stack_can/feedback"
    abort_topic: "/abort"

    # 当油门电压持续高于该阈值时，认为车辆正在给电机输出动力。
    # can_feedback_node 中 throttle_raw 按 raw * 5.0 / 255.0 换算为电压。
    throttle_high_v: 0.8

    # 当电机转速绝对值低于该阈值时，认为电机处于低速或堵转状态。
    stall_rpm_threshold: 30.0

    # “高油门 + 低转速” 持续超过该时间后触发 /abort。
    # 原地旋转、田间阻力大时容易短时低速，因此不要设置得过小。
    stall_timeout_s: 1.0

    # 是否在反馈无效时直接触发 /abort。
    # 初期建议保持 false，避免 CAN 反馈偶发丢帧导致误急停。
    abort_on_feedback_invalid: false

    protect_left_motor: true
    protect_right_motor: true
    latch_abort: true

bale_align_controller:
  ros__parameters:
    angle_lpf_alpha: 0.25
    align_enter_deg: 2.0
    align_exit_deg: 6.0

    turn_cmd_angle_deg: 10.0
    turn_frame_period_s: 0.10
    turn_pulse_frames: 5
    turn_pause_frames: 1
    turn_cycle_yaw_deg: 2.6

    approach_dist_m: 2.0
    approach_speed_kmh: 4.0

    too_close_dist_m: 1.0
    retreat_speed_kmh: 4.0

    min_dist_m: 0.0
    max_dist_m: 15.0
    target_timeout_s: 0.50

    pick_action_hold_s: 20.0

bale_detector:
  ros__parameters:
    log_detection_results: false
